[package]
name = "dsh-start"
version = "0.1.4"
description = "Auto-install and auto-start managed host for DSH (DeepSeek Harness)"
license = "Apache-2.0"
repository = "https://github.com/1x1-lab/dsh-start"
authors = ["dsh-start"]
edition = "2021"

[lib]
name = "dsh_start_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-opener = "2.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
log = { version = "0.4.33", features = ["std"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
